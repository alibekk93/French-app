<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>French App</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>French App</h1>
    <nav id="mode-switcher">
      <button data-mode="reading">Reading</button>
      <button data-mode="vocab">Vocab</button>
      <button data-mode="grammar">Grammar</button>
    </nav>
    <details id="settings">
      <summary>Settings</summary>
      <div class="row">
        <label>LibreTranslate URL <input id="lt-url" size="34"></label>
        <label>API key (if required) <input id="lt-key" size="20"></label>
        <button id="lt-save">Save</button>
        <span id="lt-status" class="status"></span>
      </div>
    </details>
  </header>

  <main id="app"></main>

  <script src="js/dictionary.js"></script>
  <script src="js/translate.js"></script>
  <script src="js/reading.js"></script>
  <script src="js/vocab.js"></script>
  <script src="js/grammar.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
